name: Validate BAYNORA Theme

on:
  push:
    branches: [main, baynora-master-design]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Twilight theme
        run: npm run production
