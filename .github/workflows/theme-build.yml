name: Validate BAYNORA Theme

on:
  push:
    branches: [main, baynora-master-design]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate theme manifest
        run: node -e "const f=require('./twilight.json'); if(!f.name||!f.repository||!Array.isArray(f.features)) process.exit(1); console.log('twilight.json OK')"

      - name: Build Twilight theme
        run: npm run production

      - name: Verify build artifacts
        run: test -f public/app.css && test -f public/app.js && test -f public/home.js
